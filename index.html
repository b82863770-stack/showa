<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المُحمّل الذكي + AI Chat</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #fff;
            border-bottom: 3px solid var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            padding: 24px;
        }

        .tab-content.active {
            display: block;
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 16px;
            text-align: center;
        }

        /* Downloader Form */
        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input[type="url"], input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            margin-bottom: 12px;
        }

        input:focus {
            border-color: var(--primary);
        }

        .radio-group {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        /* AI Chat Section */
        .chat-box {
            height: 300px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            background: #0f172a;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.user {
            align-self: flex-start;
            background: var(--primary);
            color: #fff;
        }

        .message.ai {
            align-self: flex-end;
            background: var(--border);
            color: #fff;
        }

        .chat-input-container {
            display: flex;
            gap: 8px;
        }

        .chat-input-container input {
            margin-bottom: 0;
        }

        .chat-input-container .btn {
            width: auto;
            padding: 0 20px;
        }

        .notice {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- التبويبات -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('downloader')">📥 تحميل ميديا</button>
        <button class="tab-btn" onclick="switchTab('ai-chat')">🤖 ذكاء اصطناعي</button>
    </div>

    <!-- 1. تبويب التحميل -->
    <div id="downloader" class="tab-content active">
        <h2>تحميل فيديو / صوت بدون علامة مائية</h2>
        <div class="input-group">
            <label for="video-url">رابط الفيديو (TikTok, Instagram, YouTube...):</label>
            <input type="url" id="video-url" placeholder="https://..." required>
        </div>

        <div class="radio-group">
            <label class="radio-option">
                <input type="radio" name="format" value="video" checked> فيديو بأعلى جودة (HD)
            </label>
            <label class="radio-option">
                <input type="radio" name="format" value="audio"> صوت فقط (MP3)
            </label>
        </div>

        <button class="btn" onclick="handleDownload()">بدء التنزيل</button>
        <p class="notice">بدون إعلانات • مجاني بالكامل • بدون علامة مائية</p>
    </div>

    <!-- 2. تبويب الذكاء الاصطناعي -->
    <div id="ai-chat" class="tab-content">
        <h2>مساعد الذكاء الاصطناعي</h2>
        
        <input type="password" id="api-key" placeholder="أدخل مفتاح Gemini API المجاني هنا...">
        <p class="notice" style="margin-top:-8px; margin-bottom:12px;">احصل عليه مجاناً من Google AI Studio</p>

        <div class="chat-box" id="chat-box">
            <div class="message ai">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
        </div>

        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." onkeypress="handleKeyPress(event)">
            <button class="btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>
</div>

<script>
    // التنقل بين التبويبات
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // منطق التحميل
    function handleDownload() {
        const url = document.getElementById('video-url').value;
        const format = document.querySelector('input[name="format"]:checked').value;

        if (!url) {
            alert('يرجى إدخال رابط الفيديو أولاً!');
            return;
        }

        // توجيه لخدمة API معالجة مفتوحة المصدر لتحميل الفيديو مباشر بدون علامة مائية
        const downloadApiUrl = `https://api.download-service.com/fetch?url=${encodeURIComponent(url)}&type=${format}`;
        
        alert(`جاري توجيهك لتحميل الـ ${format === 'video' ? 'فيديو' : 'صوت'} بأعلى جودة...`);
        window.open(downloadApiUrl, '_blank');
    }

    // منطق شات الذكاء الاصطناعي (Gemini API)
    async function sendMessage() {
        const apiKey = document.getElementById('api-key').value;
        const inputField = document.getElementById('user-input');
        const userMessage = inputField.value.trim();
        const chatBox = document.getElementById('chat-box');

        if (!apiKey) {
            alert('يرجى إدخال مفتاح Gemini API لاستخدام الشات!');
            return;
        }

        if (!userMessage) return;

        // إضافة رسالة المستخدم للواجهة
        appendMessage(userMessage, 'user');
        inputField.value = '';

        // إضافة مؤشر "جاري التفكير"
        const loadingMessage = appendMessage('جاري التفكير...', 'ai');

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userMessage }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                loadingMessage.innerText = data.candidates[0].content.parts[0].text;
            } else {
                loadingMessage.innerText = 'حدث خطأ في الاستجابة. تأكد من صحة المفتاح.';
            }
        } catch (error) {
            loadingMessage.innerText = 'فشل الاتصال بالذكاء الاصطناعي. تحقق من شبكة الإنترنت.';
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
